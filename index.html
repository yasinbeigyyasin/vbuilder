<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101114" />
    <title>VBuilder — Visual to code</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="topbar-left">
          <div class="brand-lockup">
            <div class="brand-mark" aria-hidden="true">
              <span></span><span></span><span></span>
            </div>
            <div class="brand-name">vbuilder</div>
          </div>
          <div class="topbar-divider"></div>
          <label class="file-name-wrap">
            <span class="sr-only">Project name</span>
            <input id="projectNameInput" class="file-name-input" value="Starter landing page" maxlength="48" />
            <span class="file-name-chevron" aria-hidden="true">⌄</span>
          </label>
          <span class="local-badge"><span class="status-dot"></span> local</span>
        </div>

        <div class="top-actions">
          <button class="icon-button" id="undoButton" type="button" title="Undo (Ctrl/Cmd + Z)" aria-label="Undo" disabled>
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7.2 5.1 3.8 8.5l3.4 3.4M4.2 8.5h6.1a5 5 0 0 1 5 5v1.2" /></svg>
          </button>
          <button class="icon-button" id="redoButton" type="button" title="Redo (Ctrl/Cmd + Shift + Z)" aria-label="Redo" disabled>
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m12.8 5.1 3.4 3.4-3.4 3.4M15.8 8.5H9.7a5 5 0 0 0-5 5v1.2" /></svg>
          </button>
          <div class="topbar-divider"></div>
          <button class="button button-quiet" id="codeButton" type="button">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m7.5 5-4 5 4 5M12.5 5l4 5-4 5M11.2 3.8 8.8 16.2" /></svg>
            <span>Code</span>
          </button>
          <button class="button button-quiet" id="previewButton" type="button">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2.7 10s2.7-5 7.3-5 7.3 5 7.3 5-2.7 5-7.3 5-7.3-5-7.3-5Z" /><circle cx="10" cy="10" r="2.1" /></svg>
            <span>Preview</span>
          </button>
          <button class="button button-primary" id="exportButton" type="button">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v9M6.5 8.5 10 12l3.5-3.5M4 15.5v1.2h12v-1.2" /></svg>
            <span>Export ZIP</span>
          </button>
        </div>
      </header>

      <div class="workspace">
        <aside class="left-panel panel">
          <div class="panel-tabs" role="tablist" aria-label="File panel">
            <button class="panel-tab active" type="button" data-left-tab="layers" role="tab" aria-selected="true">Layers</button>
            <button class="panel-tab" type="button" data-left-tab="assets" role="tab" aria-selected="false">Assets</button>
          </div>
          <div class="page-tree">
            <div class="page-tree-heading"><span>Pages</span><button class="icon-button compact" id="newProjectButton" type="button" title="New project" aria-label="New project"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12" /></svg></button></div>
            <button class="page-row active" type="button" aria-label="Current page"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 4.5h12v11H4zM7 2.5v4M13 2.5v4M4 8h12" /></svg><span id="pageTitle">Landing page</span></button>
          </div>
          <div class="layers-section">
            <div class="section-heading layers-heading"><span id="leftPanelHeading">Layers</span><span class="layer-count" id="layerCount">0</span></div>
            <div class="layers-list" id="layersList"></div>
          </div>
          <div class="panel-footer">
            <div class="footer-actions">
              <button class="footer-link" id="openProjectButton" type="button">Open project</button>
              <button class="footer-link" id="saveProjectButton" type="button">Save project</button>
            </div>
          </div>
        </aside>

        <main class="editor-area">
          <div class="editor-toolbar">
            <div class="canvas-tool-group" role="toolbar" aria-label="Tools">
              <button class="canvas-tool active" type="button" data-tool="select" title="Move tool (V)" aria-label="Move tool"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 3 10.5 6.2-5 1.1 2.7 5.1-1.9 1-2.7-5.1-3.6 3.5V3Z" /></svg></button>
              <button class="canvas-tool" type="button" data-tool="frame" data-add="section" title="Frame" aria-label="Add frame"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 6V4h2M14 4h2v2M16 14v2h-2M6 16H4v-2M7 4v12M13 4v12M4 7h12M4 13h12" /></svg></button>
              <button class="canvas-tool" type="button" data-tool="text" data-add="text" title="Text (T)" aria-label="Add text"><span class="tool-letter">T</span></button>
              <button class="canvas-tool" type="button" data-tool="shape" data-add="shape" title="Shape" aria-label="Add shape"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="4" y="4" width="12" height="12" rx="2" /><circle cx="10" cy="10" r="3" /></svg></button>
              <button class="canvas-tool" type="button" data-tool="image" data-add="image" title="Image" aria-label="Add image"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="3" width="14" height="14" rx="2" /><circle cx="7" cy="7" r="1.2" /><path d="m4.5 14 3.2-3.2 2.2 2.1 1.6-1.5 4 3.6" /></svg></button>
              <button class="canvas-tool" type="button" data-tool="button" data-add="button" title="Button" aria-label="Add button"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="6" width="14" height="8" rx="2" /><path d="M7 10h6" /></svg></button>
            </div>
            <div class="device-switcher" role="tablist" aria-label="Responsive viewport">
              <button class="device-tab active" type="button" data-device="desktop" role="tab" aria-selected="true">
                <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="3.5" width="15" height="10" rx="1.6" /><path d="M7 16.5h6M10 13.5v3" /></svg>
                <span>Desktop</span><span class="device-size">fluid</span>
              </button>
              <button class="device-tab" type="button" data-device="tablet" role="tab" aria-selected="false">
                <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="5" y="2.5" width="10" height="15" rx="1.8" /><path d="M9 15h2" /></svg>
                <span>Tablet</span><span class="device-size">768</span>
              </button>
              <button class="device-tab" type="button" data-device="mobile" role="tab" aria-selected="false">
                <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="6.3" y="2.5" width="7.4" height="15" rx="1.8" /><path d="M9 15h2" /></svg>
                <span>Mobile</span><span class="device-size">390</span>
              </button>
            </div>
            <div class="canvas-tools">
              <div class="zoom-control">
                <button class="icon-button compact" id="zoomOutButton" type="button" title="Zoom out" aria-label="Zoom out">−</button>
                <button class="zoom-label" id="zoomLabel" type="button" title="Fit canvas">Fit</button>
                <button class="icon-button compact" id="zoomInButton" type="button" title="Zoom in" aria-label="Zoom in">+</button>
              </div>
            </div>
          </div>

          <div class="canvas-space" id="canvasSpace">
            <div class="canvas-caption"><span id="canvasCaption">Desktop · 1440 × 900</span><span id="canvasZoomCaption">Fit to view</span></div>
            <div class="artboard-wrap" id="artboardWrap">
              <div class="artboard" id="artboard" aria-label="Website canvas"></div>
            </div>
          </div>
        </main>

        <aside class="right-panel panel">
          <div class="inspector-tabs" role="tablist" aria-label="Inspector mode">
            <button class="inspector-tab active" type="button" data-inspector-tab="design" role="tab" aria-selected="true">Design</button>
            <button class="inspector-tab" type="button" data-inspector-tab="prototype" role="tab" aria-selected="false">Prototype</button>
            <button class="inspector-tab" type="button" data-inspector-tab="inspect" role="tab" aria-selected="false">Inspect</button>
            <button class="icon-button compact inspector-menu" type="button" aria-label="Inspector options">⋯</button>
          </div>
          <div id="inspectorContent"></div>
        </aside>
      </div>
    </div>

    <input id="imageInput" type="file" accept="image/*" hidden />
    <input id="projectInput" type="file" accept=".vbuilder,.json,application/json" hidden />

    <div class="toast-region" id="toastRegion" aria-live="polite"></div>

    <div class="modal-backdrop hidden" id="codeModal" aria-hidden="true">
      <section class="modal code-modal" role="dialog" aria-modal="true" aria-labelledby="codeModalTitle">
        <div class="modal-header">
          <div><span class="modal-eyebrow">Generated output</span><h2 id="codeModalTitle">Your website code</h2></div>
          <button class="icon-button" type="button" data-close-modal="codeModal" aria-label="Close code dialog">×</button>
        </div>
        <div class="code-toolbar"><div class="file-tabs" id="codeFileTabs"><button class="file-tab active" type="button" data-file="index.html">index.html</button><button class="file-tab" type="button" data-file="styles.css">styles.css</button><button class="file-tab" type="button" data-file="script.js">script.js</button></div><button class="button button-quiet small-button" id="copyCodeButton" type="button">Copy code</button></div>
        <textarea class="code-output" id="codeOutput" spellcheck="false" readonly></textarea>
        <div class="modal-footer"><span class="modal-note">Generated from the current canvas. Export ZIP includes the same files and local assets.</span><button class="button button-primary" id="codeExportButton" type="button">Export ZIP</button></div>
      </section>
    </div>

    <div class="modal-backdrop hidden" id="previewModal" aria-hidden="true">
      <section class="modal preview-modal" role="dialog" aria-modal="true" aria-labelledby="previewModalTitle">
        <div class="modal-header">
          <div><span class="modal-eyebrow">Live render</span><h2 id="previewModalTitle">Landing page preview</h2></div>
          <div class="modal-header-actions"><span class="preview-device-label" id="previewDeviceLabel">Desktop</span><button class="icon-button" type="button" data-close-modal="previewModal" aria-label="Close preview">×</button></div>
        </div>
        <div class="preview-frame-wrap"><iframe id="previewFrame" title="Generated website preview" sandbox="allow-scripts"></iframe></div>
        <div class="modal-footer"><span class="modal-note">This preview uses the generated HTML and CSS, not the editor canvas.</span><button class="button button-primary" id="previewExportButton" type="button">Export ZIP</button></div>
      </section>
    </div>

    <script src="app.js"></script>
  </body>
</html>
